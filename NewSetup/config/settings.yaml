# NewSetup - global strategy parameters
# Source: Supply Chain Inefficiency Trading Playbook v1.0 (moderate model defaults)

general:
  name: "NewSetup"
  broker: "Pepperstone (Razor, MT5)"
  mode: "paper"            # paper | backtest | live
  timezone: "UTC"

mt5:
  terminal_path: "C:/Program Files/MT5-Pepperstone/terminal64.exe"  # dedicated Pepperstone terminal (portable)
  portable: true           # terminal runs in /portable mode: data lives in the install dir
  login: 61636260          # Pepperstone Razor demo account
  server: "Pepperstone-Demo"
  password_env: "PEPPERSTONE_MT5_PASSWORD"  # password never stored in the repo
  init_timeout_s: 90       # portable terminal cold start can take >60s


risk:
  risk_per_trade_pct: 0.5      # fixed fractional (Formula 1, default)
  max_open_positions: 7        # conservative band 3-7
  max_daily_loss_pct: 2.0      # halt new entries for the day
  max_sector_exposure_pct: 20  # of equity per correlation sector
  max_portfolio_heat_pct: 3.0  # total open risk
  max_margin_used_pct: 25
  drawdown_breakers:           # Appendix D circuit breakers
    pause_pct: 5.0             # pause new entries 24h
    halt_week_pct: 8.0         # halt for the week
    full_halt_pct: 12.0        # full stop + manual review
  correlation:
    max_avg: 0.5
    hard_pair_limit: 0.7       # never hold two instruments correlated above this

sizing:
  method: "fixed_fractional"   # fixed_fractional | atr_volatility | half_kelly | correlation_adjusted
  atr_mult_sl: 2.0             # stop = entry -/+ atr(14) * mult
  reward_risk: 2.0             # take profit = R multiple
  min_lot: 0.01
  lot_step: 0.01

layer1:
  scan_interval_minutes: 15
  event_score_threshold: 0.7   # GDELT goldstein/theme score
  price_spike_pct_24h: 2.0     # generic FX spike trigger
  price_spike_pct_30d: 15.0    # generic commodity 30d spike

layer2:
  min_score: 0.6               # confirmation score required (0-1)
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  sma_fast: 50
  sma_slow: 200
  min_history_bars: 210
  sentiment_threshold: -0.5    # FinBERT score needed to support SHORT-side thesis

layer3:
  max_positions_per_inefficiency: 1

backtest:
  acceptance:                  # Phase 5.3 hard criteria (moderate model)
    min_trades: 30
    max_drawdown_pct: 12.0
    min_sharpe: 1.0
    min_win_rate_pct: 48.0
    min_profit_factor: 1.3
  walk_forward:
    train_bars: 500
    test_bars: 125
    wfer_min: 0.5              # out-of-sample sharpe / in-sample sharpe

paper_trading:
  starting_balance: 10000.0
  spread_pct: 0.02             # simulated spread cost, % of price
  state_file: "data/paper_state.json"   # UGT-15 Phase 4: durable paper book
                                         # (daily cycles accumulate one account)

monitoring:                     # playbook section 9
  signal_quality:               # 9.2 per-inefficiency monthly funnel
    db_file: "db/newsetup.sqlite3"
  degradation:                  # 9.4 rolling health checks + response ladder
    window_days: 30
    min_trades: 20              # below this the window is ignored (no noise actions)
    win_rate_floor_pct: 40.0    # clearly under the 48% acceptance bar
    sharpe_floor: 0.0           # negative rolling Sharpe = degraded
    reduce_size_lot_mult: 0.5   # first automated response

ab_testing:                     # 9.5 candidate variant comparison
  min_folds: 3
  p_value_threshold: 0.05

paths:
  signals_file: "active_signals.json"
  logs_dir: "logs"
  results_dir: "backtest/results"
  db_file: "db/newsetup.sqlite3"
