# NewSetup - historical event history (UGT-17/19 rework, work item 1)
#
# Hand-curated, dated landmark supply-chain disruption events for the five
# playbook 5.2 validation windows. GDELT DOC 2.0 (the live layer-1 event
# feed) only covers recent months, so historical backtests replay EVENT
# triggers from this file plus the GDELT 2.0 export archive extract
# (scripts/fetch_gdelt_window_exports.py -> data/caches/events/).
#
# Fields per event:
#   ts:         UTC timestamp (date is the documented news date; hour is an
#               approximate session marker - stated limitation, D1/H1 bars
#               make exact hour non-binding)
#   headline:   as-reported headline text used for layer-1 keyword matching
#   goldstein:  GDELT-style conflict score, -10 (severe conflict) .. +10
#   score:      scanner relevance score 0..1 (curated events: >= 0.85)
#   themes:     free-form theme tags (informational)
#   source:     verifiable reference URL for the dated timeline
#   window:     playbook window key (backtest/event_backtests.PLAYBOOK_WINDOWS)

events:
