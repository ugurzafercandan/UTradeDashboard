# (C:\Program Files\MT5-Pepperstone\terminal64.exe, portable mode,
# account 61636260 @ Pepperstone-Demo) on 2026-11-15 via scripts/verify_feeds.py.
# Pepperstone lists commodities under mixed-case contract names and
# US stocks/ETFs under the same .US tickers as the playbook symbols.
