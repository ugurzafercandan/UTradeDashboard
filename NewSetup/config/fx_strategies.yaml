# Generated by scripts/generate_playbook_config.py from docs/sci_playbook_v1.md (SCI Playbook v1.0). Do not hand-edit.
# Appendix B: forex strategy playbook (FX-1..FX-6).
- id: FX-1
  name: Commodity Currency Basket
  description: Trade AUD, CAD, NOK as commodity proxy currencies during broad supply chain disruption events that
    push commodity prices higher.
  trigger: Broad commodity cycle
  avg_duration_days:
  - 5
  - 15
  expected_frequency: 2-4 /month
  instruments:
  - symbol: AUDUSD
    direction: LONG
    risk_pct: 3
    rationale: Australia = iron ore, copper, gold, bauxite, coal
    entry:
      metric: rsi.AUDUSD
      op: <
      value: 45
  - symbol: USDCAD
    direction: SHORT
    risk_pct: 3
    rationale: Canada = oil, uranium, potash, forestry
    entry:
      metric: rsi.USDCAD
      op: '>'
      value: 55
  - symbol: USDNOK
    direction: SHORT
    risk_pct: 2
    rationale: Norway = oil, gas, fish, metals (wider spreads -> smaller size)
    entry:
      metric: rsi.USDNOK
      op: '>'
      value: 55
  entry_variants:
    default:
    - any:
      - metric: gdelt.supply_chain_disruption_index
        op: '>'
        value: 0.6
      - metric: bcom.pct_above_200dma
        op: '>'
        value: 5
    - all:
      - metric: dxy.below_200dma
        op: ==
        value: true
    - majority:
        min_required: 2
        conditions:
        - metric: rsi.AUDUSD
          op: <
          value: 45
        - metric: rsi.USDCAD
          op: '>'
          value: 55
        - metric: rsi.USDNOK
          op: '>'
          value: 55
  position_sizing:
    max_total_risk_pct: 8
    per_instrument_risk_pct:
      AUDUSD: 3
      USDCAD: 3
      USDNOK: 2
    stop: 1.5x ATR(14) from entry
    take_profit: 3.0x ATR(14) from entry (2:1 R:R)
  exit_rules:
  - 'Profit target: TP hit on individual pairs -> close that pair'
  - 'Stop loss: SL hit on individual pairs -> close that pair'
  - 'Basket close: if 2 of 3 pairs hit SL -> close remaining pair immediately'
  - 'Time stop: 15 trading days maximum'
  - 'Regime change: DXY crosses above 200-DMA -> close all'
- id: FX-2
  name: China Export Ban Event
  description: Fast-acting event trade when China announces or signals export restrictions on critical minerals
    (gallium, germanium, antimony, rare earths, graphite, magnesium, polysilicon).
  trigger: China critical mineral restriction
  avg_duration_days:
  - 2
  - 7
  expected_frequency: 1-3 /quarter
  instruments:
  - symbol: USDCNH
    direction: SHORT
    risk_pct: 3
    rationale: CNH strengthens on export control (reduced supply -> higher value of Chinese goods)
    entry:
      metric: usdcnh.level
      op: '>'
      value: 7.1
  - symbol: AUDUSD
    direction: LONG
    risk_pct: 2
    rationale: Australia benefits as alternative supplier
    entry: null
  entry_variants:
    fast:
    - any:
      - metric: gdelt.china_mineral_export_ban_score
        op: '>'
        value: 0.8
      - metric: news.confirmed_headline_reuters_bloomberg
        op: ==
        value: true
    - all:
      - metric: usdcnh.level
        op: '>'
        value: 7.1
      - metric: portfolio.china_minerals_open_positions
        op: ==
        value: 0
    confirmed:
    - all:
      - metric: finbert.china_export_news
        op: <
        value: -0.5
    - any:
      - metric: macd.USDCNH.bearish_crossover
        op: ==
        value: true
      - metric: macd.AUDUSD.bullish_crossover
        op: ==
        value: true
  position_sizing:
    max_total_risk_pct: 5
    per_instrument_risk_pct:
      USDCNH: 3
      AUDUSD: 2
    stop_pips:
      USDCNH: 120
      AUDUSD: 60
    take_profit_pips:
      USDCNH: 250
      AUDUSD: 120
  exit_rules:
  - 'Profit target: scale out 50% at 150 pips (CNH) / 80 pips (AUD), remainder at full TP'
  - 'Stop loss: hard stop, no averaging down'
  - 'Reversal: if China announces exemptions/rollback within 48h -> close immediately'
  - 'Time stop: 7 trading days (event fading)'
- id: FX-3
  name: Chokepoint / Oil Shock
  description: Trade oil-correlated currencies when a major maritime chokepoint is disrupted (Red Sea, Hormuz, Malacca,
    Panama).
  trigger: Strait closure / oil spike
  avg_duration_days:
  - 3
  - 10
  expected_frequency: 1-2 /quarter
  instruments:
  - symbol: USDNOK
    direction: SHORT
    risk_pct: 3
    rationale: Norway is major oil exporter -> NOK strengthens
    entry:
      metric: rsi.USDNOK
      op: '>'
      value: 50
  - symbol: USDCAD
    direction: SHORT
    risk_pct: 3
    rationale: Canada is major oil exporter -> CAD strengthens
    entry:
      metric: rsi.USDCAD
      op: '>'
      value: 50
  - symbol: USDINR
    direction: LONG
    risk_pct: 2
    rationale: India is major oil importer -> INR weakens (wider spread)
    entry:
      metric: rsi.USDINR
      op: <
      value: 65
  - symbol: USDTRY
    direction: LONG
    risk_pct: 2
    rationale: Turkey is energy importer + Bosphorus proximity (volatile, carry cost)
    entry:
      metric: rsi.USDTRY
      op: <
      value: 70
  - symbol: AUDJPY
    direction: SHORT
    risk_pct: null
    rationale: Both affected, but JPY safe-haven bid dominates
    severe_only: true
    entry: null
  entry_variants:
    default:
    - all:
      - metric: gdelt.chokepoint_score
        op: '>'
        value: 0.8
      - metric: oil.intraday_spike_pct
        op: '>'
        value: 3
  position_sizing:
    max_total_risk_pct: 10
    per_instrument_risk_pct:
      USDNOK: 3
      USDCAD: 3
      USDINR: 2
      USDTRY: 2
    stop: 2.0x ATR(14) from entry
    take_profit: 3.0x ATR(14) from entry
  exit_rules:
  - 'Oil reversal: if crude drops >3% from event peak -> reduce 50%'
  - 'Resolution signal: if strait reopens / attacks stop -> close within 4h'
  - 'Time stop: 10 trading days'
  - 'Carry consideration: USDTRY short has high negative swap - limit hold time'
- id: FX-4
  name: Taiwan Tension Hedge
  description: Risk-off trade during Taiwan Strait military tension. JPY and CHF appreciate as safe havens; Asia-Pacific
    currencies weaken.
  trigger: Cross-strait military tension
  avg_duration_days:
  - 1
  - 5
  expected_frequency: 0-2 /year
  instruments:
  - symbol: AUDJPY
    direction: SHORT
    risk_pct: 3
    rationale: AUD weakens (risk-off), JPY strengthens (safe haven) - primary trade
    stop_pips: 150
    take_profit_pips: 300
    entry: null
  - symbol: CHFJPY
    direction: LONG
    risk_pct: 2
    rationale: Both safe havens, but CHF outperforms on European distance from conflict
    stop_pips: 100
    take_profit_pips: 200
    entry: null
  - symbol: USDJPY
    direction: SHORT
    risk_pct: 1
    rationale: JPY safe-haven bid dominates - smallest size (already correlated)
    stop_pips: 100
    take_profit_pips: 200
    entry: null
  entry_variants:
    default:
    - majority:
        min_required: 2
        conditions:
        - metric: gdelt.taiwan_military_score
          op: '>'
          value: 0.85
        - metric: vix.level
          op: '>'
          value: 25
        - metric: usdjpy.dropping
          op: ==
          value: true
        - metric: gold.intraday_change_pct
          op: '>'
          value: 1
  position_sizing:
    max_total_risk_pct: 6
    per_instrument_risk_pct:
      AUDJPY: 3
      CHFJPY: 2
      USDJPY: 1
    note: EXTREME CAUTION - only trade on HIGH-CONVICTION signals
  exit_rules:
  - 'De-escalation: close 50% immediately on confirmed de-escalation signal'
  - 'False alarm: if VIX drops below 20 within 48h -> close all'
  - 'Time stop: 5 trading days (unless active military operations continue)'
  - 'Profit lock: trailing stop at 1.5x ATR after 150 pips profit'
